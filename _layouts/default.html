<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0e0b" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}TimStewartJ</title>
    {% if site.baseurl contains "/previews/" %}
    <script>
      (function () {
        var shells = ["editorial", "paper", "index"];
        var shell = new URLSearchParams(window.location.search).get("shell") || "editorial";

        if (shells.indexOf(shell) === -1) {
          shell = "editorial";
        }

        document.documentElement.dataset.shell = shell;
      }());
    </script>
    {% endif %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}" />
    <link rel="shortcut icon" type="image/x-icon" href="{{ "/assets/favicon/favicon.ico" | relative_url }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/favicon/apple-touch-icon.png" | relative_url }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon/favicon-32x32.png" | relative_url }}" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/favicon/favicon-16x16.png" | relative_url }}" />
    <link rel="manifest" href="{{ "/assets/site.webmanifest" | relative_url }}" />
  </head>

  <body>
    <div class="container">
      <header class="headerholder">
        <div class="header">
          <a class="site-brand" href="{{ "/" | relative_url }}">
            <img src="{{ "/assets/images/OffProf.png" | relative_url }}" id="headimg" alt="" aria-hidden="true" />
            <span id="headtitle">Tim Stewart</span>
            <img src="{{ "/assets/images/Logo.png" | relative_url }}" id="logoimg" alt="" aria-hidden="true" />
          </a>

          <nav aria-label="Primary">
            <a href="{{ "/" | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
            <a href="{{ "/projects" | relative_url }}"{% if page.url == "/projects/" or page.categories contains "projects" %} aria-current="page"{% endif %}>Projects</a>
            <a href="{{ "/social" | relative_url }}"{% if page.url == "/social.html" %} aria-current="page"{% endif %}>Social</a>
            <a href="{{ "/resume" | relative_url }}"{% if page.url == "/resume/" %} aria-current="page"{% endif %}>Resume</a>
          </nav>
        </div>
      </header>

      {{content}}

      <footer class="footer">
        <p class="footer-title">The End</p>
        <p>All rights reserved {{ site.time | date: '%Y' }}.</p>
      </footer>

      {% if site.baseurl contains "/previews/" %}
      <aside class="shell-experiments" aria-label="Design experiments">
        <span>try</span>
        <button type="button" data-shell-choice="editorial">editorial</button>
        <button type="button" data-shell-choice="paper">paper</button>
        <button type="button" data-shell-choice="index">index</button>
      </aside>
      <script>
        (function () {
          var shells = ["editorial", "paper", "index"];
          var themeColors = {
            editorial: "#0f0e0b",
            paper: "#f4efe6",
            index: "#090b0d"
          };
          var buttons = Array.prototype.slice.call(document.querySelectorAll("[data-shell-choice]"));
          var metaTheme = document.querySelector('meta[name="theme-color"]');

          function setShell(shell) {
            if (shells.indexOf(shell) === -1) {
              shell = "editorial";
            }

            document.documentElement.dataset.shell = shell;

            if (metaTheme) {
              metaTheme.setAttribute("content", themeColors[shell]);
            }

            buttons.forEach(function (button) {
              button.setAttribute("aria-pressed", button.dataset.shellChoice === shell ? "true" : "false");
            });

            var url = new URL(window.location.href);
            url.searchParams.set("shell", shell);
            window.history.replaceState({}, "", url);
          }

          buttons.forEach(function (button) {
            button.addEventListener("click", function () {
              setShell(button.dataset.shellChoice);
            });
          });

          setShell(document.documentElement.dataset.shell || "editorial");
        }());
      </script>
      {% endif %}
    </div>
  </body>
</html>
