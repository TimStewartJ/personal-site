<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0e0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}TimStewartJ</title>
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}" />
    <link rel="shortcut icon" type="image/x-icon" href="{{ "/assets/favicon/favicon.ico" | relative_url }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/favicon/apple-touch-icon.png" | relative_url }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon/favicon-32x32.png" | relative_url }}" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/favicon/favicon-16x16.png" | relative_url }}" />
    <link rel="manifest" href="{{ "/assets/site.webmanifest" | relative_url }}" />
  </head>

  <body>
    <div class="container">
      <header class="headerholder">
        <div class="header">
          <a class="site-brand" href="{{ "/" | relative_url }}">
            <img class="brand-mark brand-mark-avatar" src="{{ "/assets/images/OffProf.png" | relative_url }}" alt="" aria-hidden="true" />
            <span id="headtitle">Tim Stewart</span>
            <img class="brand-mark brand-mark-logo" src="{{ "/assets/images/Logo.png" | relative_url }}" alt="" aria-hidden="true" />
          </a>

          <nav aria-label="Primary">
            <a href="{{ "/" | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
            <span class="nav-separator" aria-hidden="true">/</span>
            <a href="{{ "/projects" | relative_url }}"{% if page.url == "/projects/" or page.categories contains "projects" %} aria-current="page"{% endif %}>Projects</a>
            <span class="nav-separator" aria-hidden="true">/</span>
            <a href="{{ "/social" | relative_url }}"{% if page.url == "/social.html" %} aria-current="page"{% endif %}>Social</a>
            <span class="nav-separator" aria-hidden="true">/</span>
            <a href="{{ "/resume" | relative_url }}"{% if page.url == "/resume/" %} aria-current="page"{% endif %}>Resume</a>
          </nav>
        </div>
      </header>

      {{content}}

      <footer class="footer">
        <p class="footer-title">The End</p>
        <p>All rights reserved {{ site.time | date: '%Y' }}.</p>
      </footer>
    </div>

    <aside class="design-lab" data-design-lab hidden aria-label="Design options">
      <p class="design-lab__label">Design options</p>
      <div class="design-lab__options" role="group" aria-label="Design options">
        <button type="button" data-design-option="current" aria-pressed="true">Current</button>
        <button type="button" data-design-option="charm" aria-pressed="false">Original charm</button>
        <button type="button" data-design-option="reader" aria-pressed="false">Reader</button>
        <button type="button" data-design-option="lantern" aria-pressed="false">Lantern</button>
      </div>
    </aside>
    <script src="{{ "/assets/js/design-lab.js" | relative_url }}"></script>
  </body>
</html>
